name: Short Term Calls And Tracking
run-name: Short Term Paper Research · ${{ github.event_name }}
on:
  schedule:
    # Prepare at 08:50 and 09:05 IST, seal the next session after 18:05 IST.
    # Track every 15 minutes from 09:20 through 15:35 IST. GitHub timing is best effort.
    - cron: '20,35 3 * * 1-5'
    - cron: '50 3 * * 1-5'
    - cron: '5,20,35,50 4-9 * * 1-5'
    - cron: '5 10 * * 1-5'
    - cron: '35 10 * * 1-5'
    - cron: '35 12 * * 1-5'
  workflow_dispatch:
    inputs:
      connection_check:
        description: Verify FYERS equity history and Sheet access without creating test calls
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - short_term_calls/**
      - .github/workflows/short-term-calls.yml
  pull_request:
    paths:
      - short_term_calls/**
      - .github/workflows/short-term-calls.yml
permissions:
  contents: read
concurrency:
  group: short-term-calls-single-writer
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt
      - name: Verify Short Term Entry And Accounting Rules
        run: python -m unittest discover -s short_term_calls/tests -v
      - name: Verify Market Data HTTP Failure Handling
        run: |
          node postman/mocks/short-term-history/default.js > /tmp/short-term-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          python -m short_term_calls.tests.http_probe http://127.0.0.1:4922
      - name: Verify Connection After Installation
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.connection_check == true)
        run: python -m short_term_calls.run --connection-check
      - name: Generate Calls And Track All Frozen Plans
        if: github.event_name != 'push' && github.event_name != 'pull_request' && inputs.connection_check != true
        run: python -m short_term_calls.run
      - name: Preserve Calls And Candle Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-term-${{ github.run_id }}-${{ github.run_attempt }}
          path: short-term-report/
          retention-days: 90
          if-no-files-found: warn
