name: Schedule Trigger Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  schedule-test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "SCHEDULE TEST OK"
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC: $(date -u)"
