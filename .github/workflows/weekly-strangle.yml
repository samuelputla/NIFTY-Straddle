name: NIFTY Weekly Strangle Paper Monitor

on:
  workflow_dispatch:
    inputs:
      setup_only:
        description: "Create or verify the weekly summary and event-log tabs without contacting FYERS"
        required: false
        type: boolean
        default: true
  schedule:
    # Launch ahead of the market. The script connects at 09:15 IST, enters at
    # 09:30 when needed, monitors adjustments, and saves carry state at 15:30.
    - cron: "55 8 * * 1-5"
      timezone: "Asia/Kolkata"
    # Queue a short continuation behind the morning session so the six-hour
    # hosted-runner limit does not cut off 15:25 adjustments or 15:30 logging.
    - cron: "45 14 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: nifty-weekly-strangle-paper
  cancel-in-progress: false

jobs:
  weekly-strangle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      WEEKLY_SETUP_ONLY: ${{ inputs.setup_only || 'false' }}
      WEEKLY_CONTRACT_QTY: "65"
      WEEKLY_SESSION_END: ${{ github.event.schedule == '55 8 * * 1-5' && '14:50' || '15:30' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install fyers-apiv3 gspread google-auth tzdata
      - name: Run weekly paper monitor
        run: python -u weekly_strangle.py

