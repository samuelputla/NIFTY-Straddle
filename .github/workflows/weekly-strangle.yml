name: NIFTY Weekly Strangle Paper Monitor
on:
  workflow_dispatch:
    inputs:
      setup_only:
        description: "Verify weekly tabs without market-data calls"
        type: boolean
        default: true
  schedule:
    - cron: "55 8 * * 1-5"
      timezone: "Asia/Kolkata"
permissions:
  contents: read
concurrency:
  group: nifty-weekly-strangle-paper
  cancel-in-progress: false
env:
  FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  WEEKLY_SETUP_ONLY: ${{ inputs.setup_only || 'false' }}
  WEEKLY_CONTRACT_QTY: "65"
  WEEKLY_PROFITABLE_ADJUSTMENTS_ONLY: "false"
  WEEKLY_EOD_DIVERGENCE: "0.80"
jobs:
  # Hosted jobs have queue/setup latency at handoff. This is not gap-free.
  morning:
    if: ${{ vars.WEEKLY_DEDICATED_RUNNER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WEEKLY_SESSION_END: "12:30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/weekly-monitor
  afternoon:
    if: ${{ vars.WEEKLY_DEDICATED_RUNNER != 'true' && inputs.setup_only != true }}
    needs: morning
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WEEKLY_SESSION_END: "15:30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/weekly-monitor
  # Enable only after installing a private Linux runner labelled weekly-paper.
  full-session:
    if: ${{ vars.WEEKLY_DEDICATED_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, weekly-paper]
    timeout-minutes: 480
    env:
      WEEKLY_SESSION_END: "15:30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/weekly-monitor
