name: Sync Straddle Dashboard

on:
  workflow_dispatch:
  schedule:
    # Four weekday copies from Google Sheets; GitHub may start scheduled runs late.
    - cron: '0 9,13 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '40 9 * * 1-5'
      timezone: 'Asia/Kolkata'
    - cron: '15 15 * * 1-5'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

concurrency:
  group: straddle-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sheet reader
        run: python -m pip install 'google-auth>=2.40,<3' 'requests>=2.32,<3'
      - name: Sync research sheets to Straddle Lab
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STRADDLE_DASHBOARD_TOKEN: ${{ secrets.STRADDLE_DASHBOARD_TOKEN }}
        run: python -u sync_dashboard.py

