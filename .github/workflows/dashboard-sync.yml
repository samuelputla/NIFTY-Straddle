name: Sync Straddle Dashboard

on:
  workflow_dispatch:
  schedule:
    # Explicit UTC (IST = UTC + 05:30); GitHub delivery remains best effort.
    # Four weekday copies from Google Sheets; GitHub may start scheduled runs late.
    - cron: '30 3,7 * * 1-5'
    - cron: '10 4 * * 1-5'
    - cron: '45 9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: straddle-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sheet reader
        run: python -m pip install 'google-auth>=2.40,<3' 'requests>=2.32,<3'
      - name: Sync research sheets to Straddle Lab
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STRADDLE_DASHBOARD_TOKEN: ${{ secrets.STRADDLE_DASHBOARD_TOKEN }}
        run: python -u sync_dashboard.py