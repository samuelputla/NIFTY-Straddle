name: Automatic Session Control
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Verify automatic dispatch permissions only; no collectors or market requests
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['.automation/request.json']
permissions:
  contents: read
  actions: write
concurrency:
  group: automatic-paper-session-control
  cancel-in-progress: false
jobs:
  permission-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic dispatch permission verified. No Sheet changes or market requests."
  control:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'gspread>=6,<7' 'google-auth>=2.40,<3'
      - name: Validate request and start only missing paper workflows
        run: python -u automation_dispatch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-session-control-${{ github.run_id }}
          path: dispatch-report.json
          if-no-files-found: ignore
          retention-days: 14

