name: Automatic Session Control
on:
  workflow_dispatch:
    inputs:
      check_new_workflows:
        description: Read-only execution check for Nifty study and Short Strangle; never dispatches collectors
        type: boolean
        default: false
      probe:
        description: Verify automatic dispatch permissions only; no collectors or market requests
        type: boolean
        default: true
  schedule:
    # 09:20 startup check; 17:20 completion check. Read-only, including special equity sessions.
    - cron: '50 3,11 * * *'
  push:
    branches: [main]
    paths: ['.automation/request.json']
permissions:
  contents: read
  actions: write
concurrency:
  group: automatic-paper-session-control
  cancel-in-progress: false
jobs:
  permission-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe && !inputs.check_new_workflows }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic dispatch permission verified. No Sheet changes or market requests."
  control:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'gspread>=6,<7' 'google-auth>=2.40,<3'
      - name: Validate request and start only missing paper workflows
        run: python -u automation_dispatch.py
      - name: Check the two additional workflow executions
        if: always()
        run: python -u workflow_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-session-control-${{ github.run_id }}
          path: |
            dispatch-report.json
            workflow-health.json
            workflow-health.md
          if-no-files-found: ignore
          retention-days: 14

  additional-workflow-health:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_new_workflows) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test read-only health decisions
        run: python -m unittest test_workflow_health -v
      - name: Check Nifty study and Short Strangle status
        run: python -u workflow_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-workflow-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workflow-health.json
            workflow-health.md
          if-no-files-found: warn
          retention-days: 30

