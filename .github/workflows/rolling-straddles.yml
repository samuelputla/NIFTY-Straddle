name: Time & Delta Based Straddles
on:
  workflow_dispatch:
    inputs:
      setup_only:
        description: Verify Sheet schemas only; no FYERS requests or paper entries
        type: boolean
        default: false
  schedule:
    - cron: '25 3 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nifty-rolling-paper
  cancel-in-progress: false
jobs:
  wait-for-session:
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait until 09:12 IST
        id: window
        if: ${{ !inputs.setup_only }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import time as clock
          import os
          tz=ZoneInfo('Asia/Kolkata')
          target=datetime.combine(datetime.now(tz).date(),time(9,12),tzinfo=tz)
          while datetime.now(tz)<target:
              clock.sleep(min(10,max(.1,(target-datetime.now(tz)).total_seconds())))
          allowed = datetime.now(tz).time() < time(9,35)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("allowed=" + ("true" if allowed else "false") + "\n")
          if not allowed: print("Late scheduled start skipped; no new collector or position")
          PY
  track:
    if: ${{ inputs.setup_only || needs.wait-for-session.outputs.allowed == 'true' }}
    needs: wait-for-session
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      STRADDLE_DASHBOARD_TOKEN: ${{ secrets.STRADDLE_DASHBOARD_TOKEN }}
      SETUP_ONLY: ${{ inputs.setup_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-paper.txt
      - name: Verify paper state machine
        run: |
          python test_rolling.py
          python test_quote_quality.py
      - name: Track six isolated paper challengers
        run: python -u rolling_collector.py
      - name: Preserve observed state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-paper-state-${{ github.run_id }}
          path: |
            rolling_state.json
            rolling_quote_diagnostics.json
          if-no-files-found: ignore
          retention-days: 30
