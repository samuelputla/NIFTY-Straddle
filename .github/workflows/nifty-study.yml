name: Nifty study
run-name: November 11 Nifty Study And Session Repair
on:
  push:
    branches: [verify-nov11-session]
    paths: ['.github/workflows/nifty-study.yml']
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r nifty_study/requirements.txt
      - run: python -m nifty_study.run
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: nifty-short-strangle-paper
      cancel-in-progress: false
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SESSION_DATE: '2026-11-11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt
      - name: Recover VIX candle and verify Short Strangle stops
        run: |
          python vix_session_check.py
          python -m short_strangle.close_session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: november-11-short-strangle-check
          path: short_strangle_close_output/
