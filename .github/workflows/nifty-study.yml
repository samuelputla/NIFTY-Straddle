name: Nifty study
run-name: Recover 12 November Nifty Study
on:
  push:
    branches: [recover-nov12-nifty-study]
    paths: ['.github/workflows/nifty-study.yml']
permissions:
  contents: read
concurrency:
  group: nifty-equity-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r nifty_study/requirements.txt
      - name: Verify deterministic study logic
        run: python -m unittest discover -s nifty_study/tests -v
      - name: Collect, study and publish
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nifty_study/run.py')
          source = path.read_text()
          source = source.replace("day=str(now.date());OUT.mkdir", "day='2026-11-12';OUT.mkdir", 1)
          source = source.replace("    if completed>=target_open:\n        raise Unavailable('Forecast cutoff missed; no prospective forecast published')", "    late = completed >= target_open\n    if late:\n        issues.append('Forecast cutoff missed; observations and reviews only')", 1)
          source = source.replace("    save('report.json',", "    if late:\n        forecast.clear()\n        findings['next_candidates'] = []\n    save('report.json',", 1)
          source = source.replace("    sheet.publish(key,{'Study Observations'", "    if datetime.now(IST) >= target_open:\n        forecast.clear()\n        findings['next_candidates'] = []\n    sheet.publish(key,{'Study Observations'", 1)
          compile(source, str(path), 'exec')
          path.write_text(source)
          PY
          python -m nifty_study.run
      - name: Preserve raw inputs, frozen forecast and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-study-${{ github.run_id }}
          path: nifty-study-report/
          retention-days: 90
          if-no-files-found: warn
