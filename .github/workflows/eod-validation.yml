name: Daily Historical Validation
run-name: Daily validation · ${{ inputs.audit_date || 'today' }}
on:
  schedule:
    - cron: '37 10 * * 1-5'
  workflow_dispatch:
    inputs:
      audit_date:
        description: Optional past IST session date YYYY-MM-DD; blank audits today after 16:07
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: daily-historical-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      AUDIT_DATE: ${{ inputs.audit_date || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'gspread>=6,<7' 'google-auth>=2.40,<3'
      - name: Run report-only audit of all nine paper strategies
        run: python -u eod_validation.py --date "$AUDIT_DATE"
      - name: Preserve report and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-validation-${{ github.run_id }}
          path: validation-report/
          if-no-files-found: warn
          retention-days: 30

