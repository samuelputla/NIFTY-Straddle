name: Straddle V2 Paper Observer

on:
  schedule:
    - cron: '10 9 * * 1-5'
      timezone: Asia/Kolkata
  workflow_dispatch:
    inputs:
      setup_only:
        description: Create/check V2 worksheets without contacting FYERS
        type: boolean
        default: false

concurrency:
  group: straddle-v2-paper
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SETUP_ONLY: ${{ inputs.setup_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing market data and Sheets dependencies
        run: pip install fyers-apiv3 gspread google-auth tzdata
      - name: Observe Straddle V2 (paper only)
        run: python -u straddle_v2.py
      - name: Sync strategy snapshots to dashboard
        if: always()
        env:
          STRADDLE_DASHBOARD_TOKEN: ${{ secrets.STRADDLE_DASHBOARD_TOKEN }}
        run: python -u sync_dashboard.py

