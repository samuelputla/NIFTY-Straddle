name: Short Strangle 3 PM Close Check
on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Existing session date (YYYY-MM-DD), blank for today
        required: false
        type: string
  schedule:
    - cron: '35 9 * * 1-5'
  push:
    branches: [main]
    paths: ['.automation/short-strangle-close.json']
permissions:
  contents: read
concurrency:
  group: nifty-short-strangle-paper
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SESSION_DATE: ${{ inputs.session_date || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt
      - run: python -m unittest discover -s short_strangle -p 'test_*.py'
      - run: python -u -m short_strangle.close_session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-strangle-close-${{ github.run_id }}
          path: short_strangle_close_output/
          retention-days: 30
          if-no-files-found: ignore
