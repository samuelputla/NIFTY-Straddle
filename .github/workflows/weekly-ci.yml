name: Weekly paper strategy checks
on:
  pull_request:
    paths: ["weekly_*.py", "weekly_cost_profile.json", "test_weekly_strangle.py", ".github/workflows/weekly-*.yml", ".github/actions/weekly-monitor/action.yml"]
  push:
    branches: [main]
    paths: ["weekly_*.py", "weekly_cost_profile.json", "test_weekly_strangle.py", ".github/workflows/weekly-*.yml", ".github/actions/weekly-monitor/action.yml"]
permissions:
  contents: read
jobs:
  offline-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_weekly_strangle
