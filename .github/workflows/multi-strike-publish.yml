name: Publish Multi Strike
on:
  schedule:
    - cron: '41 10 * * 1-5'
  workflow_dispatch:
    inputs:
      republish_all:
        description: Refresh all published session blocks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: multi-strike-sheet-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'gspread>=6,<7' 'google-auth>=2,<3' requests
      - name: Verify required trade data publishing
        run: python -m unittest test_multi_strike_publish
      - run: python -u multi_strike_publish.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPUBLISH_ALL: ${{ inputs.republish_all || 'false' }}
