name: NIFTY Straddle Paper Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run a short live-feed verification instead of the full 09:30-15:00 session"
        required: false
        default: "false"
  push:
    branches: [main]
    paths: [".paper-test-trigger"]
  schedule:
    # GitHub cron is UTC. 04:00 UTC = 09:30 IST.
    - cron: "0 4 * * 1-5"

concurrency:
  group: nifty-straddle-paper-test
  cancel-in-progress: false

jobs:
  straddle:
    runs-on: ubuntu-latest
    timeout-minutes: 400

    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TEST_MODE: ${{ github.event_name == 'push' && 'true' || github.event.inputs.test_mode || 'false' }}
      MONITOR_MINUTES: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fyers-apiv3 gspread google-auth

      - name: Run NIFTY straddle
        run: python today_test.py
