name: NIFTY Straddle Paper Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"

jobs:
  straddle:
    runs-on: ubuntu-latest

    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fyers-apiv3
          pip install pytz

      - name: Run NIFTY straddle
        run: |
          python today_test.py