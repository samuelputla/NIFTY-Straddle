name: Fixed Entry Straddles
run-name: Dummy Observation Round Trip And Cleanup
on:
  push:
    branches: [verify-option-observations-20261110]
permissions:
  contents: read
concurrency:
  group: option-observation-dummy-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt
      - name: Verify observation logic offline
        run: python -m unittest test_option_observations
      - name: Insert verify update and remove dummy Sheet rows
        run: python observation_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dummy-observation-check-${{ github.run_id }}
          path: observation-smoke-report.json
          retention-days: 7
          if-no-files-found: warn
