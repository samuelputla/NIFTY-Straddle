name: Fixed Entry Straddles

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run a short live-feed verification instead of the full 09:30-15:00 session"
        required: false
        type: boolean
        default: false
      setup_only:
        description: "Create or verify Google Sheets tabs and headers without contacting FYERS"
        required: false
        type: boolean
        default: false
  schedule:
    # Explicit UTC (IST = UTC + 05:30); GitHub delivery remains best effort.
    # Start before the hour's peak queue and prepare contracts before the 09:30 quote request.
    - cron: "25 3 * * 1-5"

concurrency:
  group: nifty-fixed-entry-paper
  cancel-in-progress: false

jobs:
  wait-for-session:
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    # A runner started at 08:55 would reach its six-hour cap at 14:55.
    # Wait in a separate job; the monitoring job starts at/after 09:12.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait until 09:12 IST for full-session monitoring
        id: window
        if: ${{ !inputs.test_mode && !inputs.setup_only }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import time as clock
          import os
          tz = ZoneInfo("Asia/Kolkata")
          target = datetime.combine(datetime.now(tz).date(), time(9, 12), tzinfo=tz)
          while datetime.now(tz) < target:
              clock.sleep(min(10, max(0.1, (target - datetime.now(tz)).total_seconds())))
          allowed = datetime.now(tz).time() < time(9,35)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("allowed=" + ("true" if allowed else "false") + "\n")
          if not allowed: print("Late scheduled start skipped; no new collector or position")
          PY
  straddle:
    if: ${{ inputs.test_mode || inputs.setup_only || needs.wait-for-session.outputs.allowed == 'true' }}
    name: ${{ matrix.name }}
    needs: wait-for-session
    # One failed expiry must not cancel the other collectors.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Current Week Expiry
            script: today_test.py
            concurrency: nifty-straddle-paper-test
          - name: Next Week Expiry
            script: next_expiry_straddle.py
            concurrency: nifty-next-expiry-straddle-paper-test
          - name: Monthly Expiry
            script: monthly_expiry_straddle.py
            concurrency: nifty-monthly-expiry-straddle-paper-test
    # Retain each old strategy's concurrency lock during the migration.
    concurrency:
      group: ${{ matrix.concurrency }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TEST_MODE: ${{ inputs.test_mode || 'false' }}
      SETUP_ONLY: ${{ inputs.setup_only || 'false' }}
      MONITOR_MINUTES: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-paper.txt

      - name: Record actual runner startup
        run: python session_timing.py runner-start

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-paper.txt

      - name: Record collector readiness
        run: python session_timing.py collector-ready

      - name: Run selected fixed-entry straddle
        run: python -u ${{ matrix.script }}

      - name: Sync strategy snapshots even after a missed entry
        if: ${{ always() && !inputs.setup_only }}
        env:
          STRADDLE_DASHBOARD_TOKEN: ${{ secrets.STRADDLE_DASHBOARD_TOKEN }}
        run: python -u sync_dashboard.py



      - name: Preserve additive execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-execution-${{ matrix.script }}-${{ github.run_id }}
          path: fixed_execution_measurements.json
          if-no-files-found: ignore
          retention-days: 30


      - name: Preserve isolated comparison quotes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-capture-${{ matrix.script }}-${{ github.run_id }}
          path: comparison_capture_*.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

