name: NIFTY Straddle Paper Test

on:
  workflow_dispatch:

jobs:
  straddle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fyers-apiv3
          pip install pytz

      - name: Run NIFTY straddle
        run: |
          python today_test.py