name: One-Off Straddle Fixed Historical Recovery
on:
  push:
    branches: [codex/fyers-history-recovery-20261109]
    paths: ['tools/recover_fixed_history.py', '.github/workflows/fixed-history-recovery.yml']
permissions:
  contents: read
concurrency:
  group: one-off-fixed-history-20261109
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'gspread>=6,<7' 'google-auth>=2.40,<3' tzdata
      - name: Read bounded historical data without Sheet writes or orders
        run: python -u tools/recover_fixed_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: straddle-fixed-historical-recovery-${{ github.run_id }}
          path: recovery-evidence/
          if-no-files-found: warn
          retention-days: 30
